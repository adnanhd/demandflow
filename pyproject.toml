[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demandflow"
version = "0.1.0"
description = "Flow On-Demand: pull-mode dataflow with content-addressed memoization and ROS2-style nodes/topics/services"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "eclipse-zenoh>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = ["sphinx", "furo", "sphinx-autodoc-typehints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
