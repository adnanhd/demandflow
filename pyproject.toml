[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ondemand"
version = "0.1.0"
description = "Demand-driven compute framework: content-addressed memoization, ROS2-style nodes/topics/services/actions over zenoh"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "eclipse-zenoh>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
